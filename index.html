<html lang="es">
<head>

<title>Galería de pósteres</title>
<style>
:root{--blue:#0b4a6f;--blue2:#136b8c;--ink:#173042;--muted:#617785;--line:#dbe5ea;--bg:#f4f8fa;--card:#fff}
*{box-sizing:border-box} body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:var(--bg)}
.wrap{max-width:1280px;margin:auto;padding:32px 22px 60px} .intro{margin:0;color:var(--muted);font-size:16px}
.tools{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:20px 0 18px} .search{flex:1;min-width:260px;position:relative}
.search input{width:100%;border:1px solid var(--line);border-radius:12px;padding:14px 44px 14px 16px;font-size:16px;background:#fff;outline:none;box-shadow:0 2px 10px rgba(18,52,70,.05)}
.search input:focus{border-color:var(--blue2);box-shadow:0 0 0 3px rgba(19,107,140,.12)} .search span{position:absolute;right:15px;top:50%;transform:translateY(-50%);font-size:20px}
.count{color:var(--muted);font-size:14px;white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}
.card{background:#fff;border:1px solid var(--line);border-radius:15px;overflow:hidden;box-shadow:0 6px 18px rgba(20,58,78,.07);transition:.18s}
.card:hover{transform:translateY(-3px);box-shadow:0 10px 25px rgba(20,58,78,.12)}
.thumb{aspect-ratio:3/4;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;position:relative;padding:8px}
.thumb img{width:100%;height:100%;object-fit:contain;object-position:center;display:block}
.thumb:after{content:'Ver póster';position:absolute;left:12px;right:12px;bottom:12px;background:rgba(8,46,67,.88);color:#fff;text-align:center;padding:9px 10px;border-radius:9px;font-size:14px;font-weight:700;opacity:0;transform:translateY(4px);transition:.18s}
.card:hover .thumb:after,.thumb:focus:after{opacity:1;transform:none}
.meta{padding:14px 16px 17px} .id{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.03em;color:var(--blue2);background:#e9f4f8;border-radius:999px;padding:5px 8px;margin-bottom:9px}
.title{font-size:16px;line-height:1.35;font-weight:700;margin:0;color:var(--ink)} .empty{display:none;text-align:center;padding:50px 10px;color:var(--muted)}
.modal{position:fixed;inset:0;background:rgba(3,21,31,.97);z-index:999999;display:none;padding:16px} .modal.open{display:flex}
.modal-box{width:100%;height:100%;display:flex;flex-direction:column;min-width:0;min-height:0} .modal-top{display:flex;justify-content:space-between;align-items:center;gap:16px;color:#fff;margin-bottom:10px;flex:0 0 auto}
.modal-title{font-size:15px;line-height:1.35;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .actions{display:flex;gap:8px;align-items:center;flex:0 0 auto}
.btn{border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);color:#fff;border-radius:9px;padding:9px 12px;font-weight:700;cursor:pointer} .close{border:0;background:#fff;color:#173042;border-radius:999px;width:40px;height:40px;font-size:24px;cursor:pointer}
.viewer{flex:1;min-height:0;min-width:0;overflow:auto;display:flex;align-items:center;justify-content:center;text-align:center;border-radius:10px}
.viewer img{display:block;width:auto;height:auto;max-width:100%;max-height:100%;object-fit:contain;background:#fff;box-shadow:0 10px 40px rgba(0,0,0,.35);cursor:zoom-in;flex:0 0 auto}
.viewer img.zoom{max-width:none;max-height:none;width:auto;height:auto;cursor:zoom-out;margin:auto}
.hint{color:#c7d7df;font-size:12px;margin-top:8px;text-align:center;flex:0 0 auto}
.modal:fullscreen{width:100vw;height:100vh;padding:16px;background:rgba(3,21,31,.99)}
@media(max-width:1050px){.grid{grid-template-columns:repeat(3,1fr)}} @media(max-width:760px){.wrap{padding:24px 15px 45px}.grid{grid-template-columns:repeat(2,1fr);gap:12px}.meta{padding:12px}.title{font-size:14px}.btn{display:none}} @media(max-width:480px){.grid{grid-template-columns:1fr}.thumb{aspect-ratio:4/5}.tools{align-items:stretch}.count{width:100%}}
</style>
</head>
<body>

<p class="intro">Consulta los trabajos presentados y busca por título o número de ID.</p>

const grid=document.getElementById('grid'), q=document.getElementById('q'), count=document.getElementById('count'), empty=document.getElementById('empty');
const modal=document.getElementById('modal'), mimg=document.getElementById('mimg'), mtitle=document.getElementById('mtitle'), close=document.getElementById('close'), viewer=document.getElementById('viewer'), fs=document.getElementById('fs');
const norm=s=>(s||'').toString().normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function render(){const term=norm(q.value);const list=posters.filter(p=>!term||norm(p.id).includes(term)||norm(p.title).includes(term));count.textContent=`${list.length} ${list.length===1?'póster':'pósteres'}`;empty.style.display=list.length?'none':'block';grid.innerHTML=list.map(p=>`<article class="card">${p.image?`<div class="thumb" tabindex="0" data-id="${esc(p.id)}"><img loading="lazy" src="https://mcapdevila1.github.io/posteres/${encodeURIComponent(p.image)}" alt="Póster ${esc(p.id)}: ${esc(p.title)}"></div>`:`<div class="thumb"><div>Imagen no disponible</div></div>`}<div class="meta"><span class="id">ID ${esc(p.id)}</span><h2 class="title">${esc(p.title)}</h2></div></article>`).join('');grid.querySelectorAll('.thumb[data-id]').forEach(el=>{const op=()=>openPoster(el.dataset.id);el.addEventListener('click',op);el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();op();}})})}
function openPoster(id){
  const p=posters.find(x=>x.id===id);
  if(!p||!p.image)return;

  const imageUrl=
    'https://mcapdevila1.github.io/posteres/'+encodeURIComponent(p.image);

  const w=window.open('', '_blank');

  if(!w)return;

  w.document.open();

  w.document.write(`
<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>ID ${p.id}</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#061923;
  font-family:Arial,Helvetica,sans-serif;
}

.poster-page{
  width:100vw;
  height:100vh;
  display:flex;
  flex-direction:column;
}

.poster-header{
  height:54px;
  flex:0 0 54px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
  padding:7px 16px;
  color:#fff;
  background:#061923;
}

.poster-title{
  font-size:14px;
  font-weight:600;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}

.poster-close{
  flex:0 0 auto;
  border:0;
  background:#fff;
  color:#173042;
  font-size:15px;
  font-weight:700;
  padding:9px 17px;
  border-radius:8px;
  cursor:pointer;
}

.poster-view{
  flex:1;
  min-height:0;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:auto;
  padding:8px;
}

.poster-view img{
  display:block;
  max-width:100%;
  max-height:100%;
  width:auto;
  height:auto;
  object-fit:contain;
  background:#fff;
  cursor:zoom-in;
  box-shadow:0 10px 40px rgba(0,0,0,.45);
}

.poster-view img.zoom{
  max-width:none;
  max-height:none;
  width:auto;
  height:auto;
  cursor:zoom-out;
  margin:auto;
}
</style>
</head>

<body>

<div class="poster-page">

  <div class="poster-header">

    <div class="poster-title">
      ID ${p.id} · ${esc(p.title)}
    </div>

    <button
      class="poster-close"
      onclick="window.close()">
      Cerrar
    </button>

  </div>

  <div class="poster-view">

    <img
      src="${imageUrl}"
      alt="Póster ID ${p.id}"
      onclick="this.classList.toggle('zoom')"
    >

  </div>

</div>

</body>
</html>
  `);

  w.document.close();
}
  async function closePoster(){if(document.fullscreenElement){try{await document.exitFullscreen()}catch(e){}}modal.classList.remove('open');modal.setAttribute('aria-hidden','true');mimg.src='';document.body.style.overflow=''}
q.addEventListener('input',render);close.addEventListener('click',closePoster);modal.addEventListener('click',e=>{if(e.target===modal)closePoster()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal.classList.contains('open')&&!document.fullscreenElement)closePoster()});mimg.addEventListener('click',()=>{mimg.classList.toggle('zoom');viewer.scrollTop=viewer.scrollLeft=0});fs.addEventListener('click',async()=>{try{if(!document.fullscreenElement)await modal.requestFullscreen();else await document.exitFullscreen()}catch(e){}});render();
</script>
</body></html>
